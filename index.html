<style>
/* Nocturne in Ice: base theme, title and setup screens. */
:root {
  --night: #0a1220; --night-2: #101b31; --steel: #22324f; --steel-hi: #34486e;
  --frost: #dfe8f2; --snow: #f5f8fb; --ice: #9fc3dd; --mist: #8fa0c0;
  --brass: #c9a55a; --brass-hi: #ecd49a; --brass-lo: #7d6128; --signal: #b3283a;
  --paper: #f4efe4; --ink: #1c2433;
  --display: "Poiret One", "Josefin Sans", sans-serif;
  --deco: "Josefin Sans", "Futura", "Trebuchet MS", sans-serif;
  --serif: "Libre Baskerville", Georgia, serif;
  --type: "Courier Prime", "Courier New", monospace;
  --hand: "Dancing Script", "Segoe Script", cursive;
  --news: "Playfair Display", Georgia, serif;
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--night); }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; color: var(--frost); font-family: var(--serif); font-size: 17px; line-height: 1.6;
  background: radial-gradient(120% 60rem at 50% -10%, #1b2b4d 0%, var(--night-2) 40%, var(--night) 100%) no-repeat, var(--night);
}
body.modal-open { overflow: hidden; }
img, svg { max-width: 100%; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.2; }
p { margin: 0 0 .8em; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 3px; border-radius: 4px; }
.screen[hidden] { display: none !important; }

<script>
/* Nocturne in Ice: envelope A, part 1 (English). */
(function () {
  'use strict';
  var C = window.CASE, Art = window.Art, D = C.docs.en, esc = C.esc;

  D.A1 = function (ctx) {
    var n = ctx.names.filter(Boolean).map(esc);
    var who = n.length === 2 ? 'Detectives ' + n[0] + ' and ' + n[1] : n.length === 1 ? 'Detective ' + n[0] : 'Detectives';
    return '<article class="doc doc-letter">' + C.letterhead('Cantonal Police', 'Sankt Oswin post · Inspector A. Tscharner') +
      '<p class="doc-date">Sankt Oswin station, Saturday 19 December 1936, 03:15</p>' +
      '<p>Dear ' + who + ',</p>' +
      '<p>Forgive me for knocking at your compartment at this hour. The attendant of your car tells me you are detectives. He also tells me that you both went to bed at ten o’clock and never stirred, which makes you the only two people on this train I am sure of.</p>' +
      '<p>At six minutes past midnight, Casimir Delorme, the watchmaker of La Chaux-de-Fonds, was found shot dead in his berth in compartment 5 of sleeping car 2. His door to the corridor was bolted and chained on the inside.</p>' +
      '<p>An avalanche has buried the line beyond Sankt Oswin. The Alpine Nocturne will not move before the snowplough reaches us, the pass road is closed, and nobody leaves this train. I am the only policeman for thirty kilometres, and I am a village policeman.</p>' +
      '<p>Seven passengers had a reason, or a chance, to want Monsieur Delorme dead. Everything I have so far is in this file. As my search goes on, I will pass you more in sealed envelopes. Some things only you can open for me, starting with Monsieur Delorme’s dispatch case.</p>' +
      '<p>By the time the snowplough gets through, I need to know who killed Casimir Delorme, how it was done, when, and why.</p>' +
      '<p>Everyone on this train has a watch. Trust none of them.</p>' +
      '<p class="sign">A. Tscharner</p><p class="sign-sub">Inspector, Cantonal Police</p></article>';
  };

  D.A2 = function () {
    return '<article class="doc doc-report">' + C.head() + '<h3 class="rep-title">Scene report: sleeping car 2, compartment 5</h3>' +
      C.kv([['Train', 'The Alpine Nocturne, Paris–Vienna, held at Sankt Oswin station since 23:59 (avalanche on the line ahead)'],
        ['Victim', 'Casimir Delorme, 67, of La Chaux-de-Fonds, founder of Delorme & Cie, watchmakers'],
        ['Found', '00:06, by the attendant Emil Stoffel and Mrs Margit Delorme'],
        ['Police aboard', '00:40'], ['Doctor', 'Dr Ursina Caflisch, village doctor, examined the body at 00:55']]) +
      '<h4>How he was found</h4><p>At 00:04 the attendant knocked to wake Mr Delorme, who had asked to be woken at Sankt Oswin. No answer. The attendant unlocked the door with his key, but the safety chain was on and the door opened only four centimetres. He fetched Mrs Delorme from compartment 6, which joins no. 5 by a communicating door, and they went in that way.</p>' +
      '<h4>The body (marker 1)</h4><p>In the berth, on his back, in pyjamas. Shot once in the head at close range through a pillow: a scorched hole, feathers everywhere. No weapon anywhere in the compartment.</p>' +
      '<h4>Doors and window</h4><ul class="items"><li>Corridor door: locked, bolted and on the chain from inside.</li>' +
      '<li>Communicating door to compartment 6 (marker 2): the bolt on the side of no. 5 was drawn back, that is, open. The bolt on the side of no. 6 was also open.</li>' +
      '<li>Window: shut, blind half down.</li></ul>' +
      '<h4>On the folding table</h4><ul class="items"><li>Marker 3: a bottle of Vichy water, half empty; a glass; a folded paper from a sleeping powder (veronal), empty.</li>' +
      '<li>Marker 4: Mr Delorme’s gold hunter watch, open, going, and correct to the minute.</li></ul>' +
      '<h4>Elsewhere</h4><ul class="items"><li>Marker 5: black leather dispatch case, initials C.&nbsp;D., shut with a four-wheel combination lock. Not forced. Nobody aboard knows the combination.</li>' +
      '<li>Marker 6: his jacket on the hook. In the pockets: a wallet with 420 Swiss and 1,100 French francs; passport; ticket; a receipt from the Zurich station telegraph office, 18 Dec., 20:55, for two telegrams, reply paid: one to the <i>Pfarramt Sankt Oswin</i> (the parish priest), 24 words, and one to <i>J. Morand, Innsbruck</i>, 13 words; replies to “Delorme, Alpine Nocturne, Sankt Oswin station”. Also a typewritten letter from J. Morand of Innsbruck (A9).</li></ul>' +
      '<p>Nothing appears to have been taken.</p>' +
      C.note('The stationmaster is out on the line with the avalanche crew and his office is locked. I’ll ask him about any telegrams as soon as he is back.') +
      '<div class="stamp">Confidential</div></article>';
  };

  D.A3 = function () {
    return C.photo(Art.compartment(), 'Compartment 5, photographed at 01:20 by Otto Kessler of <i>Die Woche im Bild</i> at the inspector’s request, after the body was moved to the luggage van. The numbered markers match the scene report.');
  };

  D.A4 = function () {
    return '<article class="doc doc-dossier"><h3 class="dos-title">The seven suspects</h3>' +
      '<p class="dos-note">Everyone else aboard was asleep, in plain view of the staff, or had never met Mr Delorme. I have checked. That leaves these seven. — A.&nbsp;T.</p><div class="dos-grid">' +
      C.suspects.map(function (s) {
        return '<section class="dos-card">' + Art.portrait(s.id, 'portrait') + '<div><h4>' + s.name + '</h4>' +
          '<p class="dos-role">' + C.L(s.role) + ', ' + s.age + '</p>' + C.kv([['From', C.L(s.from)], ['Compartment', C.L(s.comp)]], 'kv-tight') +
          '<p>' + C.L(s.about) + '</p></div></section>';
      }).join('') + '</div></article>';
  };

  D.A5 = function () {
    var rows = [['Paris-Est', '', '11.50¹'], ['Troyes', '13.26¹', '13.28¹'], ['Chaumont', '14.34¹', '14.36¹'],
      ['Belfort', '17.18¹', '17.22¹'], ['Mulhouse', '17.56¹', '17.58¹'], ['Saint-Louis, <i>frontier</i>', '', '18.27¹ <i>passes</i>'],
      ['Basel SBB', '19.34²', '19.52²'], ['Zurich HB', '20.48', '21.02'], ['Sargans', '22.00', '22.03'],
      ['<i>Grauhorn Tunnel</i>', '22.24', '22.35'], ['Pradella', '23.06', '23.08'], ['Sankt Oswin', '23.59', '00.04'],
      ['Innsbruck Hbf', '03.40', '03.52'], ['Wien Westbahnhof', '10.15', '']];
    return '<article class="doc doc-timetable"><header class="tt-head">' + Art.mark('tt-mark') +
      '<div><p class="tt-name">The Alpine Nocturne</p><p class="tt-sub">Train de luxe · sleeping cars only · Winter service 1936–37</p></div></header>' +
      '<p class="tt-route">Paris – Basel – Zurich – Sankt Oswin – Innsbruck – Vienna</p>' +
      C.table(['Station', 'arr.', 'dep.'], rows, 'tt-table') +
      '<p class="tt-foot">¹ French time. ² From the frontier onwards, all times are Central European Time, one hour ahead of French time. Passengers are kindly asked to put their watches forward one hour as the train crosses the frontier.</p>' +
      '<div class="tt-cols"><section><h4>On the way</h4><p><b>Basel.</b> Swiss customs and passports on board. Change of engine; the dining car joins the train.</p>' +
      '<p><b>The Grauhorn Tunnel.</b> 8.7 km beneath the Grauhorn (3,412 m). From Sargans the Oswin Railway hauls the Nocturne by steam, and in the tunnel we run at a steady 48 km/h: eleven minutes in the dark. It is the only tunnel of any length on our route. Kindly keep windows closed in the tunnel; the smoke is considerable.</p>' +
      '<p><b>Sankt Oswin.</b> Mountain village at the foot of the Grauhorn’s south face. Telegrams for passengers may be collected at the station office during our five-minute stop.</p></section>' +
      '<section><h4>Services</h4><p><b>Dining car:</b> first sitting 19.55, second sitting 21.00. The dining car closes at 22.00.</p>' +
      '<p><b>Salon car:</b> bar and writing desk, open until 01.00. Drinks may be signed for and settled at Vienna.</p>' +
      '<p><b>Attendants:</b> ring once for your attendant, twice for the bar. Your attendant will wake you at any hour you wish.</p></section></div>' +
      '<p class="tt-co">Société Transalpine de Wagons-Lits</p></article>';
  };

  D.A6 = function () {
    var L = { title: 'Plan of the train', front: 'Front of the train', back: 'Back', car1: 'SLEEPING CAR 1', car2: 'SLEEPING CAR 2', corridor: 'corridor',
      attendant: 'Attendant', gangway: 'gangway between car 1 and car 2', door: 'communicating door between two compartments', cdoor: 'compartment door to the corridor',
      engine: 'Engine', van: 'Luggage van', salon: 'Salon car', dining: 'Dining car' };
    var P = { car1: ['', 'Aebi', 'R. Delorme', '', 'Oberholzer', 'O. Kessler', '', 'You two', '', ''],
      car2: ['Egli', 'T. Barić', 'H. Duclos', 'C. Pryor', 'C. Delorme', 'M. Delorme', 'K. Imhof', 'Dr Wirz', 'F. v.|Aschau', ''] };
    return '<article class="doc doc-plan"><h3 class="rep-title">Plan of the Alpine Nocturne, night of 18–19 December</h3><div class="plan-wrap">' + Art.trainPlan(L, P) + '</div>' +
      C.table(['Where', 'Who', 'Notes'], [
        ['Luggage van', 'Alois Tschudi, guard', 'Passengers are never left alone in the van.'],
        ['Car 1', 'Anton Brändli, attendant', 'Seat at the back end of car 1, by the gangway to car 2. Keeps a night log.'],
        ['Car 1, nos. 2 and 5', 'Mr Aebi, Mr Oberholzer', 'Commercial travellers from Basel.'],
        ['Car 1, no. 6', 'Otto Kessler', 'Photographer, <i>Die Woche im Bild</i>.'],
        ['Car 2', 'Emil Stoffel, attendant', 'Seat at the front end of car 2, by the gangway to car 1.'],
        ['Car 2, no. 1', 'Mr and Mrs Egli', 'Both over eighty; asleep by 21:30.'],
        ['Car 2, no. 8', 'Dr Hans Wirz', 'Dentist; asleep with wax earplugs from 21:00.'],
        ['Car 2, no. 10', '(empty)', ''],
        ['Salon car', 'Paolo Rinaldi, barman', 'Behind car 2.'],
        ['Dining car', 'Henri Vautier, steward; Giuseppe Ferro, chef', 'At the back of the train.']]) +
      '</article>';
  };
})();

<script>
/* Nocturne in Ice: envelope A, part 2 (English). */
(function () {
  'use strict';
  var C = window.CASE, D = C.docs.en;
  var q = function (t) { return '<p>“' + t + '”</p>'; };

  D.A7 = function () {
    var ids = ['baron', 'margit', 'raoul', 'baric', 'stoffel', 'pryor', 'klara'];
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">First interviews, 01:00 to 02:45</h3>' +
      '<p class="rep-intro">Taken in the dining car, one at a time. Their own words, as near as I could write them. — A.&nbsp;T.</p>' + C.jump('A7', ids) +
      C.stmt('A7', 'baron', q('I’ve known Casimir since September; we were to sign in Vienna on Monday. I dined with him, his wife and his son at the first sitting. Casimir was quiet, odd even. He left before the dessert to send a wire at Zurich. Business, I suppose.') +
        q('At about a quarter past nine I stopped at his compartment to say goodnight. He said he wanted one more day to think about the agreement and that I would have his answer at Sankt Oswin. Old men get cold feet. I wasn’t worried.') +
        q('Then I wrote letters in my compartment until about ten. At a quarter past ten I went along to the salon car and sat with Madame Duclos, a delightful old lady. We talked about the Andes. I left her at a quarter to eleven and went to bed. I heard nothing until the attendant started shouting at midnight, and after that I stayed in my compartment.') +
        q('Sankt Oswin? I was carried through it on a stretcher in 1934. I remember nothing of the place and hoped never to see it again. The avalanche has a cruel sense of humour.') +
        C.note('Hands unsteady; he says it is the cold. Wears a gold Delorme wristwatch, which he tells me Casimir made for him in 1931.')) +
      C.stmt('A7', 'margit', q('I had one of my migraines. After dinner I went to my compartment. At about ten I knocked on the communicating door and said goodnight to Casimir. He was reading in bed and said he’d taken his powder. Then I lay down in the dark, fell asleep and heard nothing at all until the attendant woke me at midnight.') +
        q('Casimir never bolted his side of that door. He liked to think I might come in. I never bolted mine either.') +
        q('My pistol? It’s in my dressing case. The whole corridor saw it at Basel, when the customs officer made his little scene. I carry it because I so often travel alone.') +
        q('Was I happy? I was married to a clock, Inspector. He was kind and he was punctual, and he was never once late for anything in his life.')) +
      C.stmt('A7', 'raoul', q('Yes, I went to see my father after dinner, at about half past nine, and yes, we shouted. I expect the whole car heard. He was selling forty per cent of the firm to a man he’d known for three months and making him a director over my head.') +
        q('I said, “You’d let a stranger into the firm before your own son?” And he said the oddest thing. He laughed and said, “A stranger? You have no idea how right you are.” Then he told me to get out.') +
        q('I went back to my compartment in car 1 at about five to ten and stayed there. I read, I slept, I saw nobody. I didn’t kill my father. I don’t need his money that badly.') +
        C.note('Smelled of cognac. Answered every question before I had finished asking it.')) +
      C.stmt('A7', 'baric', q('I will not pretend I liked him. In 1924 I built an escapement that runs ten years without oil. Delorme patented it in his own name, and he has sold a hundred thousand “Nocturne” watches with my heart inside them. On Tuesday my case is heard in Vienna.') +
        q('At dinner I lost my temper. I told him that before this night was over he would answer for what he stole. I meant the court papers: my lawyer asked me to put a copy in his hands before the hearing.') +
        q('At a quarter past ten I went to the luggage van to see to my clock, the prototype, in crate 14. It is the proof of my case, and the van is cold. When I came back I knocked on his door to give him the papers. No answer. I went to bed.') +
        q('You are looking at my hands, Inspector. Yes, with the tools in my bag I could open most locks on this train. I did not open his.') +
        C.note('A roll of fine watchmaker’s picks and drivers in his bag.')) +
      C.stmt('A7', 'stoffel', q('At five past ten Monsieur Delorme rang. I brought him his Vichy water and his sleeping powder, as every night. He asked me to wake him at Sankt Oswin: “a letter will be waiting for me there.” As I went out I heard him put the chain on behind me.') +
        q('Then I sat at my post at the end of the corridor until midnight. I never left it. Nobody went into number 5 or number 6. At about twenty to eleven the Croatian gentleman knocked at number 5, got no answer and went back to his compartment.') +
        q('At four minutes past midnight I knocked to wake him. The chain was on. I fetched Madame from number 6 and we went in through the communicating door. I’ll not forget it.') +
        q('Did he say anything else tonight? He said, “I have written to your company, Stoffel.” About November. He was a hard man about drink.')) +
      C.stmt('A7', 'pryor', q('I’d never met the man before tonight. I dined at the first sitting, at a table of my own, and read in my compartment afterwards.') +
        q('At a quarter past nine I passed his door and heard him say to someone, “You’ll have my answer at Sankt Oswin, not before.”') +
        q('At about a quarter past ten I went to the salon car for a gin fizz and to write. I stayed at the bar until just after we came out of the long tunnel, then walked back to bed. As I came into car 2 the Croatian gentleman was knocking at number 5 and nobody answered. That was about twenty to eleven. I remember that the attendant’s seat at the far end of the car was empty; I wanted a hot-water bottle and there was no one to ask.') +
        q('Why am I on this train? I’m writing about the Alps in winter.') +
        C.note('Her notebook is in shorthand. She would not let me read it.')) +
      C.stmt('A7', 'klara', q('I have been Monsieur Delorme’s secretary for six years. After dinner, at a quarter to ten, I took my portfolio to the writing desk in the salon car and wrote up his letters until nearly eleven. Then I went to bed.') +
        q('He was not himself after dinner. At Zurich he got down to send two telegrams himself; he never does that, he always sends me. When he came back he asked whether I remembered the baron’s watch being ordered in 1931. I didn’t. I was in the Geneva office then.') +
        q('The dispatch case? He resets the combination at the start of every journey. He sets it to the minute the train crosses into Switzerland, and by Swiss time, always. “A Swiss watchmaker keeps Swiss time,” he used to say. I never knew the numbers. It amused him that I didn’t.') +
        C.note('Wept throughout.')) + '</article>';
  };

  D.A8 = function () {
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Witness statements</h3>' +
      C.stmt('A8', 'duclos', q('I am eighty-one, Inspector, and I sleep badly on trains, so I sit up in the salon car. I went there after the second sitting and had my first tisane at about twenty past nine.') +
        q('The baron came and sat with me at a quarter past ten. I know because he asked me the time and I looked at my watch; it is my Albert’s watch, and I keep it open on the table in front of me. The moment he sat down he ordered me a fresh camomile and a cognac for himself, and he told me about the mountains of the Argentine. Such a gentleman. At a quarter to eleven he asked me the time again, kissed my hand and went to bed. He never left my table in all that time.') +
        q('My daughter writes that I must take my drops at seven o’clock, and I took them just as we pulled out of Basel, at eight minutes to seven. The customs men had been very rude to that poor Hungarian lady.') +
        q('After the baron left I dozed in my chair until the train stopped and everyone began to run about.')) +
      C.stmt('A8', 'vautier', q('First sitting, 19:55. At the Delorme table: Monsieur and Madame Delorme, Monsieur Raoul and the baron. Monsieur Delorme hardly ate. He kept looking at the baron’s wrist, the way a jeweller looks at a stone. Once he asked him, “Does it still strike the quarters for you?” The baron laughed and said he never bothered with the thing.') +
        q('The English lady at table 3 left at five past eight, before her main course came.') +
        q('At about half past eight the gentleman at table 7, Monsieur Barić, stood up and shouted at Monsieur Delorme: “Before this night is over, you will answer for what you stole!” I asked him to sit down, and he did.') +
        q('At twenty to nine Monsieur Delorme got up before his dessert and said he had to send a wire at Zurich. The dining car closed at ten, as it always does.')) + '</article>';
  };

  D.A9 = function () {
    return '<article class="doc doc-typed">' + C.typed('A9', { name: 'J. MORAND', sub: 'HORLOGERIE · RHABILLAGES · INNSBRUCK, TIROL', mark: 'edelweiss' }, [
      '                              Innsbruck, 14 December 1936', '', 'Monsieur C. Delorme', 'Delorme & Cie, La Chaux-de-Fonds', '',
      'Dear Monsieur Delorme,', '',
      'Thank you for your letter of the 2nd. I regret that [the]',
      'cold has kept me from the bench, but your chronometer',
      'will be ready before Christmas. The en[grave]r promises the',
      'case back by Friday, and I shall send it on to you [at]',
      'once. Your instructions for the balance I have followed', 'to the letter.', '',
      'As to the other matter: I went over the pass by way of',
      '[Sankt] Anton, as you asked, and called on my cousin',
      '[Oswin], who still keeps the old ledgers of the valley. He',
      '[holds] that nothing up there is quite what it seems. [A]',
      'curious business, and I will say no more of it on paper.',
      'The undertaker of 1934 is an old man now, but he',
      'remembers everything. You will understand when we meet.', '',
      'Finally, the repeater you sent me has a winding stem cut',
      'for a [left]-hand thread, which is why it would not take.',
      'I have [handed] it to my apprentice to re-cut. The best',
      '[man] for such work is away in Geneva until January.', '',
      'With my respectful greetings,', '', '                                             J. Morand'], 'Typewritten letter from J. Morand') +
      '<p class="caption">Typewritten on one sheet. Found folded in the inside pocket of Mr Delorme’s jacket.</p></article>';
  };

  D.A10 = function () {
    return '<article class="doc doc-form"><header class="form-head"><p class="form-org">Swiss Federal Customs · Basel SBB</p><p class="form-no">No. 4471</p></header>' +
      '<h3 class="form-title">Declaration of firearms carried by a traveller</h3>' +
      C.kv([['Date and time', '18 December 1936, 19:41'], ['Train', 'The Alpine Nocturne, sleeping car 2'],
        ['Traveller', 'Mrs Margit Delorme, compartment 6'], ['Weapon', 'Automatic pistol, FN Herstal, calibre 6.35 mm, “Baby” model'],
        ['Serial number', '<span class="mono">81 604</span>'], ['Ammunition', 'Six cartridges in the magazine'], ['Permit', 'Hungarian firearms permit no. 2207/1934, in order'],
        ['Decision', 'Returned to the owner']]) +
      '<p class="form-remarks"><b>Remarks.</b> The lady objected loudly to the inspection, which was carried out in the corridor in view of several passengers (car 2, nos. 2, 4, 7 and 9). The pistol was put back in her dressing case in their sight.</p>' +
      '<p class="form-sig">Customs officer <span class="sigline hand-sig">Gisler</span></p></article>';
  };
})();

</script>
<script>
/* Nocturne in Ice: envelope A, part 1 (Croatian). */
(function () {
  'use strict';
  var C = window.CASE, Art = window.Art, D = C.docs.hr, esc = C.esc;

  D.A1 = function (ctx) {
    var n = ctx.names.filter(Boolean).map(esc);
    var who = n.length === 2 ? 'detektivi ' + n[0] + ' i ' + n[1] : n.length === 1 ? 'detektive ' + n[0] : 'detektivi';
    return '<article class="doc doc-letter">' + C.letterhead('Kantonalna policija', 'Postaja Sankt Oswin · inspektor A. Tscharner') +
      '<p class="doc-date">Postaja Sankt Oswin, subota 19. prosinca 1936., 03:15</p>' +
      '<p>Poštovani ' + who + ',</p>' +
      '<p>oprostite što kucam na vaš kupe u ovo doba. Poslužitelj vašeg vagona kaže da ste detektivi. Kaže i da ste oboje legli u deset sati i da se niste ni pomaknuli, što vas čini jedinim dvjema osobama u ovom vlaku u koje sam siguran.</p>' +
      '<p>U šest minuta iza ponoći Casimir Delorme, urar iz La Chaux-de-Fondsa, pronađen je ustrijeljen u svom ležaju u kupeu 5 spavaćih kola 2. Vrata njegova kupea prema hodniku bila su iznutra zaključana zasunom i lancem.</p>' +
      '<p>Lavina je zatrpala prugu iza Sankt Oswina. Alpski nokturno neće krenuti dok do nas ne stigne ralica, cesta preko prijevoja je zatvorena i nitko ne napušta ovaj vlak. Ja sam jedini policajac u krugu od trideset kilometara, i to seoski policajac.</p>' +
      '<p>Sedmero putnika imalo je razlog ili priliku poželjeti smrt gospodina Delormea. Sve što zasad imam nalazi se u ovom spisu. Kako pretraga bude napredovala, slat ću vam još u zapečaćenim omotnicama. Neke stvari samo vi možete otvoriti umjesto mene, počevši od aktovke gospodina Delormea.</p>' +
      '<p>Dok se ralica ne probije, moram znati tko je ubio Casimira Delormea, kako je to učinjeno, kada i zašto.</p>' +
      '<p>Svatko u ovom vlaku ima sat. Ne vjerujte nijednom.</p>' +
      '<p class="sign">A. Tscharner</p><p class="sign-sub">Inspektor kantonalne policije</p></article>';
  };

  D.A2 = function () {
    return '<article class="doc doc-report">' + C.head() + '<h3 class="rep-title">Zapisnik o očevidu: spavaća kola 2, kupe 5</h3>' +
      C.kv([['Vlak', 'Alpski nokturno, Pariz–Beč, zadržan na postaji Sankt Oswin od 23:59 (lavina na pruzi ispred)'],
        ['Žrtva', 'Casimir Delorme, 67, iz La Chaux-de-Fondsa, osnivač urarske tvrtke Delorme & Cie'],
        ['Pronađen', 'u 00:06; pronašli su ga poslužitelj Emil Stoffel i gospođa Margit Delorme'],
        ['Policija u vlaku', '00:40'], ['Liječnica', 'dr. Ursina Caflisch, seoska liječnica, pregledala je tijelo u 00:55']]) +
      '<h4>Kako je pronađen</h4><p>U 00:04 poslužitelj je pokucao da probudi gospodina Delormea, koji je tražio da ga se probudi u Sankt Oswinu. Nije bilo odgovora. Poslužitelj je otključao vrata svojim ključem, ali sigurnosni lanac bio je namješten pa su se vrata otvorila samo četiri centimetra. Pozvao je gospođu Delorme iz kupea 6, koji je s brojem 5 spojen vratima između kupea, i ušli su tim putem.</p>' +
      '<h4>Tijelo (oznaka 1)</h4><p>U ležaju, na leđima, u pidžami. Pogođen jednim hicem u glavu iz neposredne blizine, kroz jastuk: nagorjela rupa, perje posvuda. U kupeu nema oružja.</p>' +
      '<h4>Vrata i prozor</h4><ul class="items"><li>Vrata prema hodniku: iznutra zaključana, zatvorena zasunom i lancem.</li>' +
      '<li>Vrata između kupea prema kupeu 6 (oznaka 2): zasun sa strane broja 5 bio je povučen, dakle otvoren. Zasun sa strane broja 6 također je bio otvoren.</li>' +
      '<li>Prozor: zatvoren, zastor napola spušten.</li></ul>' +
      '<h4>Na preklopnom stoliću</h4><ul class="items"><li>Oznaka 3: boca vode Vichy, dopola prazna; čaša; presavijen papirić od praška za spavanje (veronal), prazan.</li>' +
      '<li>Oznaka 4: zlatni džepni sat s poklopcem gospodina Delormea, otvoren, radi i točan je u minutu.</li></ul>' +
      '<h4>Ostalo</h4><ul class="items"><li>Oznaka 5: crna kožna aktovka s inicijalima C.&nbsp;D., zatvorena bravom s četiri kotačića. Nije nasilno otvarana. Nitko u vlaku ne zna kombinaciju.</li>' +
      '<li>Oznaka 6: njegov sako na vješalici. U džepovima: novčanik s 420 švicarskih i 1100 francuskih franaka; putovnica; vozna karta; potvrda brzojavnog ureda na postaji Zürich od 18. prosinca, 20:55, za dva brzojava s plaćenim odgovorom: jedan za <i>Pfarramt Sankt Oswin</i> (župni ured), 24 riječi, i jedan za <i>J. Morand, Innsbruck</i>, 13 riječi; odgovori na adresu „Delorme, Alpski nokturno, postaja Sankt Oswin“. Također pismo J. Moranda iz Innsbrucka otipkano na stroju (A9).</li></ul>' +
      '<p>Čini se da ništa nije odneseno.</p>' +
      C.note('Šef postaje vani je na pruzi s ekipom za lavinu, a ured mu je zaključan. Pitat ću ga za brzojave čim se vrati.') +
      '<div class="stamp">Povjerljivo</div></article>';
  };

  D.A3 = function () {
    return C.photo(Art.compartment(), 'Kupe 5, snimio u 01:20 Otto Kessler iz <i>Die Woche im Bild</i> na inspektorov zahtjev, nakon što je tijelo preneseno u prtljažni vagon. Brojčane oznake odgovaraju zapisniku o očevidu.');
  };

  D.A4 = function () {
    return '<article class="doc doc-dossier"><h3 class="dos-title">Sedmero osumnjičenih</h3>' +
      '<p class="dos-note">Svi ostali u vlaku spavali su, bili na očima osoblja ili nikad nisu upoznali gospodina Delormea. Provjerio sam. Ostaje ovih sedmero. — A.&nbsp;T.</p><div class="dos-grid">' +
      C.suspects.map(function (s) {
        return '<section class="dos-card">' + Art.portrait(s.id, 'portrait') + '<div><h4>' + s.name + '</h4>' +
          '<p class="dos-role">' + C.L(s.role) + ', ' + s.age + '</p>' + C.kv([['Podrijetlo', C.L(s.from)], ['Kupe', C.L(s.comp)]], 'kv-tight') +
          '<p>' + C.L(s.about) + '</p></div></section>';
      }).join('') + '</div></article>';
  };

  D.A5 = function () {
    var rows = [['Paris-Est', '', '11.50¹'], ['Troyes', '13.26¹', '13.28¹'], ['Chaumont', '14.34¹', '14.36¹'],
      ['Belfort', '17.18¹', '17.22¹'], ['Mulhouse', '17.56¹', '17.58¹'], ['Saint-Louis, <i>granica</i>', '', '18.27¹ <i>prolazi</i>'],
      ['Basel SBB', '19.34²', '19.52²'], ['Zürich HB', '20.48', '21.02'], ['Sargans', '22.00', '22.03'],
      ['<i>Tunel Grauhorn</i>', '22.24', '22.35'], ['Pradella', '23.06', '23.08'], ['Sankt Oswin', '23.59', '00.04'],
      ['Innsbruck Hbf', '03.40', '03.52'], ['Wien Westbahnhof', '10.15', '']];
    return '<article class="doc doc-timetable"><header class="tt-head">' + Art.mark('tt-mark') +
      '<div><p class="tt-name">Alpski nokturno</p><p class="tt-sub">Train de luxe · samo spavaća kola · zimski vozni red 1936./37.</p></div></header>' +
      '<p class="tt-route">Pariz – Basel – Zürich – Sankt Oswin – Innsbruck – Beč</p>' +
      C.table(['Postaja', 'dol.', 'odl.'], rows, 'tt-table') +
      '<p class="tt-foot">¹ Francusko vrijeme. ² Od granice nadalje sva su vremena po srednjoeuropskom vremenu, sat ispred francuskoga. Putnike ljubazno molimo da pomaknu satove sat unaprijed kad vlak prijeđe granicu.</p>' +
      '<div class="tt-cols"><section><h4>Usput</h4><p><b>Basel.</b> Švicarska carina i putovnice u vlaku. Mijenja se lokomotiva; priključuje se vagon-restoran.</p>' +
      '<p><b>Tunel Grauhorn.</b> 8,7 km ispod Grauhorna (3412 m). Od Sargansa Nokturno vuče parna lokomotiva Oswinske željeznice, a kroz tunel vozimo stalnih 48 km/h: jedanaest minuta u mraku. To je jedini dugi tunel na našoj ruti. Molimo da u tunelu prozori ostanu zatvoreni; dima je mnogo.</p>' +
      '<p><b>Sankt Oswin.</b> Planinsko selo u podnožju južne stijene Grauhorna. Brzojave za putnike moguće je preuzeti u uredu postaje tijekom našeg zaustavljanja od pet minuta.</p></section>' +
      '<section><h4>Usluge</h4><p><b>Vagon-restoran:</b> prva smjena u 19.55, druga u 21.00. Vagon-restoran zatvara se u 22.00.</p>' +
      '<p><b>Salonski vagon:</b> bar i pisaći stol, otvoreno do 01.00. Pića se mogu potpisati i platiti u Beču.</p>' +
      '<p><b>Poslužitelji:</b> pozvonite jednom za svog poslužitelja, dvaput za bar. Vaš će vas poslužitelj probuditi u koje god doba želite.</p></section></div>' +
      '<p class="tt-co">Société Transalpine de Wagons-Lits</p></article>';
  };

  D.A6 = function () {
    var L = { title: 'Plan vlaka', front: 'Čelo vlaka', back: 'Začelje', car1: 'SPAVAĆA KOLA 1', car2: 'SPAVAĆA KOLA 2', corridor: 'hodnik',
      attendant: 'Poslužitelj', gangway: 'prijelaz između vagona 1 i vagona 2', door: 'vrata između dvaju kupea', cdoor: 'vrata kupea prema hodniku',
      engine: 'Lokomotiva', van: 'Prtljažni vagon', salon: 'Salonski vagon', dining: 'Vagon-restoran' };
    var P = { car1: ['', 'Aebi', 'R. Delorme', '', 'Oberholzer', 'O. Kessler', '', 'Vas dvoje', '', ''],
      car2: ['Egli', 'T. Barić', 'H. Duclos', 'C. Pryor', 'C. Delorme', 'M. Delorme', 'K. Imhof', 'Dr. Wirz', 'F. v.|Aschau', ''] };
    return '<article class="doc doc-plan"><h3 class="rep-title">Plan Alpskog nokturna u noći 18. na 19. prosinca</h3><div class="plan-wrap">' + Art.trainPlan(L, P) + '</div>' +
      C.table(['Gdje', 'Tko', 'Napomena'], [
        ['Prtljažni vagon', 'Alois Tschudi, kondukter', 'Putnici se nikad ne ostavljaju sami u prtljažnom vagonu.'],
        ['Vagon 1', 'Anton Brändli, poslužitelj', 'Sjedi na stražnjem kraju vagona 1, uz prijelaz u vagon 2. Vodi noćni dnevnik.'],
        ['Vagon 1, br. 2 i 5', 'g. Aebi, g. Oberholzer', 'Trgovački putnici iz Basela.'],
        ['Vagon 1, br. 6', 'Otto Kessler', 'Fotograf, <i>Die Woche im Bild</i>.'],
        ['Vagon 2', 'Emil Stoffel, poslužitelj', 'Sjedi na prednjem kraju vagona 2, uz prijelaz u vagon 1.'],
        ['Vagon 2, br. 1', 'g. i gđa Egli', 'Oboje stariji od osamdeset; spavali su od 21:30.'],
        ['Vagon 2, br. 8', 'dr. Hans Wirz', 'Zubar; spavao s voštanim čepićima u ušima od 21:00.'],
        ['Vagon 2, br. 10', '(prazno)', ''],
        ['Salonski vagon', 'Paolo Rinaldi, barmen', 'Iza vagona 2.'],
        ['Vagon-restoran', 'Henri Vautier, šef sale; Giuseppe Ferro, kuhar', 'Na začelju vlaka.']]) +
      '</article>';
  };
})();

</script>
<script>
/* Nocturne in Ice: envelope A, part 2 (Croatian). */
(function () {
  'use strict';
  var C = window.CASE, D = C.docs.hr;
  var q = function (t) { return '<p>„' + t + '“</p>'; };

  D.A7 = function () {
    var ids = ['baron', 'margit', 'raoul', 'baric', 'stoffel', 'pryor', 'klara'];
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Prva saslušanja, od 01:00 do 02:45</h3>' +
      '<p class="rep-intro">Uzeta u vagonu-restoranu, jedno po jedno. Njihovim riječima, koliko sam ih uspio zapisati. — A.&nbsp;T.</p>' + C.jump('A7', ids) +
      C.stmt('A7', 'baron', q('Casimira poznajem od rujna; u ponedjeljak smo trebali potpisati u Beču. Večerao sam s njim, njegovom ženom i sinom u prvoj smjeni. Casimir je bio šutljiv, čak čudan. Otišao je prije deserta da pošalje brzojav u Zürichu. Posao, pretpostavljam.') +
        q('Oko devet i četvrt svratio sam do njegova kupea da mu zaželim laku noć. Rekao je da želi još jedan dan razmisliti o ugovoru i da ću odgovor dobiti u Sankt Oswinu. Starcima se ohlade noge. Nisam se brinuo.') +
        q('Zatim sam do otprilike deset pisao pisma u svom kupeu. U deset i četvrt otišao sam u salonski vagon i sjeo s madame Duclos, divnom staricom. Pričali smo o Andama. Ostavio sam je u petnaest do jedanaest i otišao spavati. Ništa nisam čuo dok poslužitelj u ponoć nije počeo vikati, a nakon toga sam ostao u svom kupeu.') +
        q('Sankt Oswin? Kroz njega su me 1934. nosili na nosilima. Ne sjećam se ničega o tom mjestu i nadao sam se da ga više nikad neću vidjeti. Lavina ima okrutan smisao za humor.') +
        C.note('Ruke mu drhte; kaže da je to od hladnoće. Nosi zlatni Delormeov ručni sat za koji kaže da mu ga je Casimir izradio 1931.')) +
      C.stmt('A7', 'margit', q('Imala sam jednu od svojih migrena. Nakon večere otišla sam u svoj kupe. Oko deset pokucala sam na vrata između kupea i zaželjela Casimiru laku noć. Čitao je u krevetu i rekao da je uzeo prašak. Zatim sam legla u mraku, zaspala i nisam čula baš ništa dok me poslužitelj u ponoć nije probudio.') +
        q('Casimir nikad nije zatvarao zasun sa svoje strane tih vrata. Volio je misliti da bih mogla ući. Ni ja nikad nisam zatvarala svoj.') +
        q('Moj pištolj? U mojoj je kutiji za toaletni pribor. Cijeli ga je hodnik vidio u Baselu, kad je carinik napravio onu svoju malu scenu. Nosim ga jer tako često putujem sama.') +
        q('Jesam li bila sretna? Bila sam udana za sat, inspektore. Bio je dobar i bio je točan, i ni za što u životu nije zakasnio ni jednom.')) +
      C.stmt('A7', 'raoul', q('Da, poslije večere otišao sam do oca, oko pola deset, i da, vikali smo. Pretpostavljam da je cijeli vagon čuo. Prodavao je četrdeset posto tvrtke čovjeku kojeg poznaje tri mjeseca i postavljao ga za direktora iznad mene.') +
        q('Rekao sam: ‚Radije ćeš u tvrtku pustiti stranca nego vlastitog sina?‘ A on je rekao nešto vrlo čudno. Nasmijao se i rekao: ‚Stranca? Nemaš pojma koliko si u pravu.‘ Zatim mi je rekao da se gubim.') +
        q('Vratio sam se u svoj kupe u vagonu 1 oko pet do deset i ostao ondje. Čitao sam, spavao, nikoga nisam vidio. Nisam ubio oca. Toliko mi njegov novac ne treba.') +
        C.note('Zaudara na konjak. Na svako pitanje odgovarao je prije nego što sam ga dovršio.')) +
      C.stmt('A7', 'baric', q('Neću se pretvarati da mi je bio drag. Godine 1924. napravio sam zapor koji radi deset godina bez ulja. Delorme ga je patentirao pod svojim imenom i prodao sto tisuća satova ‚Nocturne‘ s mojim srcem u njima. U utorak se moj predmet raspravlja u Beču.') +
        q('Za večerom sam izgubio živce. Rekao sam mu da će prije kraja ove noći odgovarati za ono što je ukrao. Mislio sam na sudske spise: odvjetnik me zamolio da mu prije ročišta predam primjerak u ruke.') +
        q('U deset i četvrt otišao sam u prtljažni vagon pogledati svoj sat, prototip, u sanduku 14. To je dokaz za moj slučaj, a u vagonu je hladno. Kad sam se vratio, pokucao sam mu na vrata da mu dam spise. Nije bilo odgovora. Otišao sam spavati.') +
        q('Gledate mi ruke, inspektore. Da, alatom iz svoje torbe mogao bih otvoriti većinu brava u ovom vlaku. Njegovu nisam otvorio.') +
        C.note('U torbi smotuljak finih urarskih igala i odvijača.')) +
      C.stmt('A7', 'stoffel', q('U deset i pet monsieur Delorme je pozvonio. Donio sam mu vodu Vichy i prašak za spavanje, kao svake večeri. Zamolio me da ga probudim u Sankt Oswinu: ‚ondje će me čekati pismo.‘ Dok sam izlazio, čuo sam kako iza mene stavlja lanac.') +
        q('Zatim sam sjedio na svom mjestu na kraju hodnika do ponoći. Nisam se maknuo. Nitko nije ušao u broj 5 ni u broj 6. Oko dvadeset do jedanaest hrvatski gospodin pokucao je na broj 5, nitko nije odgovorio i vratio se u svoj kupe.') +
        q('U četiri minute iza ponoći pokucao sam da ga probudim. Lanac je bio stavljen. Pozvao sam madame iz broja 6 i ušli smo kroz vrata između kupea. To neću zaboraviti.') +
        q('Je li mi večeras rekao još nešto? Rekao je: ‚Pisao sam vašoj tvrtki, Stoffel.‘ Zbog studenoga. Bio je strog kad je riječ o piću.')) +
      C.stmt('A7', 'pryor', q('Tog čovjeka nikad prije večeras nisam upoznala. Večerala sam u prvoj smjeni, sama za stolom, a poslije sam čitala u svom kupeu.') +
        q('U devet i četvrt prošla sam pokraj njegovih vrata i čula ga kako nekome govori: ‚Odgovor ćete dobiti u Sankt Oswinu, ne prije.‘') +
        q('Oko deset i četvrt otišla sam u salonski vagon na gin fizz i pisati. Ostala sam za šankom dok nismo izašli iz dugog tunela, a onda sam se vratila spavati. Kad sam ušla u vagon 2, hrvatski gospodin kucao je na broj 5 i nitko nije odgovarao. Bilo je oko dvadeset do jedanaest. Sjećam se da je mjesto poslužitelja na drugom kraju vagona bilo prazno; htjela sam termofor, a nisam imala koga pitati.') +
        q('Zašto sam u ovom vlaku? Pišem o Alpama zimi.') +
        C.note('Bilježnica joj je stenografska. Nije mi je dala čitati.')) +
      C.stmt('A7', 'klara', q('Tajnica sam gospodina Delormea šest godina. Nakon večere, u petnaest do deset, odnijela sam mapu do pisaćeg stola u salonskom vagonu i prepisivala njegova pisma gotovo do jedanaest. Onda sam otišla spavati.') +
        q('Poslije večere nije bio svoj. U Zürichu je sam sišao poslati dva brzojava; to nikad ne radi, uvijek pošalje mene. Kad se vratio, pitao me sjećam li se kad je 1931. naručen barunov sat. Nisam se sjećala. Tada sam radila u ženevskom uredu.') +
        q('Aktovka? Kombinaciju mijenja na početku svakog putovanja. Namjesti je na minutu u kojoj vlak ulazi u Švicarsku, i to uvijek po švicarskom vremenu. ‚Švicarski urar drži se švicarskog vremena‘, znao je reći. Nikad nisam znala brojeve. Zabavljalo ga je što ih ne znam.') +
        C.note('Plakala je cijelo vrijeme.')) + '</article>';
  };

  D.A8 = function () {
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Izjave svjedoka</h3>' +
      C.stmt('A8', 'duclos', q('Imam osamdeset i jednu godinu, inspektore, i u vlakovima loše spavam, pa sjedim u salonskom vagonu. Otišla sam onamo nakon druge smjene i prvi čaj popila oko devet i dvadeset.') +
        q('Barun je došao i sjeo sa mnom u deset i četvrt. Znam jer me pitao koliko je sati, a ja sam pogledala na sat; to je sat mog Alberta i držim ga otvorenog na stolu ispred sebe. Čim je sjeo, naručio mi je novu kamilicu, a sebi konjak, i pričao mi o planinama u Argentini. Pravi gospodin. U petnaest do jedanaest opet me pitao koliko je sati, poljubio mi ruku i otišao spavati. Za sve to vrijeme nije se maknuo od mog stola.') +
        q('Kći mi piše da kapi moram uzimati u sedam sati, i uzela sam ih baš kad smo krenuli iz Basela, osam minuta do sedam. Carinici su bili vrlo neljubazni prema onoj jadnoj Mađarici.') +
        q('Kad je barun otišao, drijemala sam u fotelji dok vlak nije stao i svi se nisu počeli trkati.')) +
      C.stmt('A8', 'vautier', q('Prva smjena, 19:55. Za stolom Delormeovih: monsieur i madame Delorme, monsieur Raoul i barun. Monsieur Delorme gotovo ništa nije jeo. Stalno je gledao barunov zglob, onako kako draguljar gleda kamen. Jednom ga je pitao: ‚Otkucava li vam još četvrti?‘ Barun se nasmijao i rekao da se nikad ne zamara tom napravom.') +
        q('Engleska dama za stolom 3 otišla je u osam i pet, prije nego što je stiglo glavno jelo.') +
        q('Oko pola devet gospodin za stolom 7, monsieur Barić, ustao je i viknuo na monsieura Delormea: ‚Prije kraja ove noći odgovarat ćete za ono što ste ukrali!‘ Zamolio sam ga da sjedne i sjeo je.') +
        q('U dvadeset do devet monsieur Delorme ustao je prije deserta i rekao da mora poslati brzojav u Zürichu. Vagon-restoran zatvorio se u deset, kao i uvijek.')) + '</article>';
  };

  D.A9 = function () {

  C.noteLines.hr = [{ t: 'M —' }, { t: 'Večeras, kad se zatvori vagon-restoran.', size: 23 }, { t: 'Vagon 1, vrata 3. Nitko neće vidjeti.', size: 24 }, { t: 'Spali ovo.' }, { t: '— R.', x: 300 }];

  D.C5 = function () {
    return C.chits('Računi s bara, salonski vagon, petak 18. prosinca', C.chitRows({ t: 'stol', desk: 'pisaći stol', bar: 'šank', kirsch2: '2 kirscha', kirsch: '1 kirsch',
      beer2: '2 piva', coffee: '1 crna kava', fizz: '1 gin fizz', tisane: '1 čaj od kamilice', water: '1 čaša vode', cognac: '1 konjak (Martell)' }),
      'Svaki račun otiskuje se na satu za žigosanje na baru, koji barmen svake večeri namješta prema željezničkom satu iznad šanka. Gosti se potpisuju imenom, vagonom i kupeom.');
  };

  D.C6 = function () {
    var rows = [['21:30', 'Gospoda Aebi (2) i Oberholzer (5) u salonski vagon.'], ['21:32', 'G. R. Delorme (3) prema vagonu 2.'],
      ['21:40', 'G. Kessler (6) prema salonskom vagonu, s fotoaparatom.'], ['21:55', 'G. R. Delorme natrag u br. 3.'],
      ['22:00', 'Namješteni ležajevi u br. 8 za dvoje detektiva. U br. 8 ugašeno svjetlo.'],
      ['22:05', 'Dama u ogrtaču od srebrne lisice došla je iz vagona 2 i otišla uz hodnik. Bio sam kod ormara s posteljinom, napola okrenut leđima: nisam joj vidio lice ni na koja je vrata ušla.'],
      ['22:15', 'G. Barić (vagon 2) prošao do prtljažnog vagona.'], ['22:24–22:35', 'Tunel Grauhorn.'], ['22:38', 'G. Barić vratio se iz prtljažnog vagona, prema vagonu 2.'],
      ['22:52', 'Dama u srebrnom krznu vratila se niz hodnik i prošla u vagon 2.'],
      ['23:40', 'Gospoda Aebi i Oberholzer vratili se iz salonskog vagona.'], ['23:50', 'G. Kessler vratio se iz salonskog vagona.'],
      ['00:10', 'Stoffel (vagon 2) dotrčao po glavnog konduktera.'], ['00:12', 'G. Kessler izašao s aparatom na peron.']];
    return '<article class="doc doc-log"><h3 class="rep-title">Noćni dnevnik, spavaća kola 1</h3><p class="log-sub">Vodi ga Anton Brändli, poslužitelj, na svom mjestu uz prijelaz u vagon 2. Tvrtka od svakog poslužitelja traži da noću bilježi tko prolazi.</p>' +
      C.table(['Vrijeme', 'Zapis'], rows) +
      C.hand('<p>Između 21:55 i 22:52 pokraj mog mjesta nitko nije prošao osim kako je ovdje zapisano. Iz vagona 1 u vagon 2 nije prešao nitko osim dame i g. Barića. — A. Brändli</p>', 'hand-small') + '</article>';
  };

  D.C7 = function () {
    return '<article class="doc doc-news"><header class="np-mast"><p class="np-name">Der Alpenbote</p><p class="np-line">Chur · utorak, 21. kolovoza 1934. · br. 196 · 20 rappena</p></header>' +
      '<h3 class="np-head">Tragedija na Grauhornu</h3><p class="np-deck">Poginuo vodič iz Sankt Oswina; austrijski barun preživio pad niz sjevernu stijenu</p>' +
      '<div class="np-cols"><figure class="np-fig">' + Art.grauhorn1934() + '<figcaption>Barun Friedrich von Aschau (lijevo) i njegov vodič Kaspar Gredig kod planinarske kuće na Grauhornu u nedjelju ujutro, prije uspona. Fotografija: A. Bundi, Sankt Oswin.</figcaption></figure>' +
      '<p>U nedjelju je poznati vodič iz Sankt Oswina <b>Kaspar Gredig</b>, 34, izgubio život u sjevernoj stijeni Grauhorna (3412 m) vodeći baruna Friedricha von Aschaua iz Innsbrucka.</p>' +
      '<p>Prema barunovim riječima, dvojica su bila navezana na uže ispod vršnog grebena kad se oko jedanaest sati prijepodne odlomila snježna streha. Obojica su pala oko 300 metara. Spasioci iz Sankt Oswina došli su do njih u ponedjeljak.</p>' +
      '<p>Barun je pronađen pri svijesti, ali teško ozlijeđen, s ozljedama lica i lijeve šake; na nosilima je snesen u dolinu i prevezen u bolnicu u Innsbrucku. Spasiocima je, kako doznajemo, uspio reći svoje ime, ali malo što drugo.</p>' +
      '<p>Vodičevo tijelo, izvučeno kasno u ponedjeljak, bilo je toliko unakaženo da ga „ni rođena majka ne bi prepoznala“, rekao je jedan spasilac našim novinama. Gredig, neoženjen, kojemu je majka umrla prošle godine, vodio je na Grauhorn od 1922. Godine 1929. izgubio je vršak jednog prsta zbog ozeblina, ali s klijentom nikad nije doživio nesreću.</p>' +
      '<p>Bit će pokopan u Sankt Oswinu u subotu.</p></div>' +
      '<p class="np-trans">(Prevedeno s njemačkog. Pribodeno u čekaonici postaje Sankt Oswin, gdje još visi Gredigova slika.)</p></article>';
  };

  D.C8 = function () {
    return C.tornDoc('Pronađeno u pepeljari kupea 6, poderano na šest komada. Jedan je ugao nagorio, kao da ju je netko počeo paliti pa izgubio hrabrost.');
  };
})();

<script>
/* Nocturne in Ice: envelope D (English). */
(function () {
  'use strict';
  var C = window.CASE, D = C.docs.en;
  var q = function (t) { return '<p>“' + t + '”</p>'; };

  D.D1 = function () {
    var ids = ['margit', 'raoul', 'stoffel', 'baric', 'pryor', 'klara', 'baron'];
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Second interviews, 04:30 to 06:00</h3>' +
      '<p class="rep-intro">This time I put the evidence in front of each of them first. — A.&nbsp;T.</p>' + C.jump('D1', ids) +
      C.stmt('D1', 'margit', q('Very well. I wasn’t in my compartment. At five past ten I went to Raoul’s, in car 1, number 3, and I stayed until just before eleven. The note was from him. I began to burn it and lost my nerve, and tore it up instead.') +
        q('When I came back my window was wide open, the compartment was like ice and there was soot everywhere, on the sill, on my pillow. I thought Stoffel had aired it and forgotten it. I shut it and got into bed. I didn’t look in on Casimir. God forgive me, I was glad of the closed door.') +
        q('The pistol? I haven’t touched it since Basel. I never lock the dressing case. Anyone who stood in that corridor saw exactly where it went.')) +
      C.stmt('D1', 'raoul', q('The note is mine. We’ve been… since the summer. My father didn’t know. Or perhaps he did; he knew most things.') +
        q('After the row I went back to my compartment at five to ten and I never left it again until the conductor came through at midnight. Margit came at about five past ten and went back at about ten to eleven. Ask your attendant in car 1; he sits there all night with his little book.')) +
      C.stmt('D1', 'stoffel', q('I lied to you, Inspector, and I’m sorry for it. I left my post at ten past ten and went to the dining car pantry for ice, and Giuseppe poured me a grappa for the tunnel, as he always does. The photographer took our picture. I was back at my seat at a quarter to eleven.') +
        q('I didn’t see the Croatian gentleman knock. The English lady told me about it afterwards. I said I’d seen it because Monsieur Delorme had already written to the Company about me, and I’d have lost my place.')) +
      C.stmt('D1', 'baric', q('Ask the guard. He never left my side in the van; they don’t trust passengers with the luggage. I came back just after the tunnel and knocked to give Delorme his papers. There was no answer, and I thought the old man was ignoring me, as he always had.') +
        q('Now you tell me he was already dead when I knocked. I have wished him dead for ten years, Inspector. It is a strange thing to find that I am sorry.')) +
      C.stmt('D1', 'pryor', q('All right: I wrote to him, three times. And I searched his compartment during dinner, from about five past eight until half past, looking for the workshop’s medical records. I found his pyjamas and a dispatch case I couldn’t open. I must have lost a hairpin under the berth.') +
        q('But at half past ten I was on a stool at the bar with my second gin fizz, and when the photographer’s flash went off I nearly dropped it. You have the picture.')) +
      C.stmt('D1', 'klara', q('He told me in November. He was my father, and he was going to say so, in Vienna, in front of a notary, on Monday. After twenty-eight years.') +
        q('Do you think I would kill him three days before he gave me his name? Now I am nobody again. The old will doesn’t know I exist.') +
        q('I was at the writing desk the whole evening, with my back to the room. The photographer made me jump.')) +
      C.stmt('D1', 'baron', q('I have told you. From a quarter past ten until a quarter to eleven I sat with Madame Duclos. Ask her.') +
        q('Your photograph shows her alone at half past ten? Then I was in the washroom. What a question to ask a man.') +
        q('I did not leave the train at Sankt Oswin. My coat is wet because I stood on the step for a breath of air. I don’t know any stationmaster.') +
        q('The watch? I have always worn it on the left. Casimir fussed about that crown for years.') +
        C.note('I asked him to make the repeater strike the quarters for me. He turned the crown back and forth for some time before he found the slide. The chief conductor, who is from Ticino and speaks Spanish, tried him in it; he says the baron’s Spanish is “the Spanish of a schoolbook”.')) + '</article>';
  };

  D.D2 = function () {
    return '<article class="doc doc-report">' + C.head() + '<h3 class="rep-title">Statement of Men Cadonau, stationmaster, Sankt Oswin</h3>' + '<p class="rep-intro">Taken at 04:20, when he came back from the avalanche.</p>' +
      q('At half past eleven Father Casutt came down from the church through the snow with a letter. “For Herr Delorme on the Nocturne,” he said. “Give it to him and nobody else.” I put it in my drawer.') +
      q('At a quarter past midnight, when the train had been standing a quarter of an hour, a gentleman came into my office from the train. Tall, fur collar, a scar on the left cheek. He asked if there was a letter or a telegram for Herr Delorme. He asked in our own valley German. You don’t hear that outside the Oswin valley; I took him for one of our families gone to the city.') +
      q('I said Father Casutt had left a letter, but that I could give it to Herr Delorme and nobody else. He said Herr Delorme was asleep and didn’t wish to be woken, and he’d take it to him. I said no. He looked at me a long moment and went back to the train.') +
      q('At twenty past twelve I locked the office and went out on the line with the avalanche crew. When I heard Herr Delorme was dead, I kept the letter for you. Here it is. I have not opened it.') + '</article>';
  };

  D.D3 = function () {
    return '<article class="doc doc-hand"><p class="hd-head">Pfarramt Sankt Oswin · 18 December 1936, 23:20</p>' +
      C.hand('<p>Dear Herr Delorme,</p><p>Your telegram reached me at a quarter to ten tonight. You ask whether Kaspar Gredig, the guide whom I buried here on 25 August 1934, was left-handed or right-handed.</p>' +
        '<p>He was right-handed. I watched him carve and shoot and cut bread for thirty years, always with the right hand.</p>' +
        '<p>But I must tell you what I have told no one. When I washed the body before we buried it, the middle finger of the left hand had the hard callus that comes from holding a pen for many years. Kaspar could barely write his name. I told myself that grief was playing tricks on me, and the face was gone, and the baron was in hospital in Innsbruck, and who was I to say anything.</p>' +
        '<p>If you know something, for the love of God, tell me. I will take this down to the station myself.</p><p>Luzi Casutt, parish priest</p>') +
      '<p class="caption">Handed to the police by the stationmaster at 04:20, unopened.</p></article>';
  };

  D.D4 = function () {
    return '<article class="doc doc-report">' + '<header class="rep-head"><span>Oswin Railway · Permanent Way</span><span>Track patrol</span></header>' +
      '<h3 class="rep-title">Track patrol report, Grauhorn Tunnel</h3>' +
      C.kv([['Patrol', 'Gion Derungs, foreman, with two men'], ['Time', '19 December 1936, 02:10 to 03:05, north portal to south portal on foot'],
        ['Reason', 'After the avalanche alarm, every tunnel on the line is walked to look for fallen ice']]) +
      '<p>At <b>3.9 km</b> from the north portal, in the ballast beside the down line, the line the Nocturne takes, we found a small automatic pistol: FN, calibre 6.35 mm, “Baby” model, serial number <span class="mono">81 604</span>. Black with soot. One cartridge fired, five left in the magazine.</p>' +
      '<p>It lay a metre from the rail, where a thing thrown from a carriage window would land.</p>' +
      '<p>No other train has passed through the tunnel since the Nocturne went through between 22:24 and 22:35. The line was closed behind it at Sargans at 22:40 because of the snow.</p>' +
      '<p class="sign">G. Derungs</p></article>';
  };

  D.D5 = function () {
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Statements of the train staff</h3>' +
      C.stmt('D5', 'tschudi', q('Mr Barić came to the van at a quarter past ten to see his crate, number 14. A big clock, all glass and brass. I stayed with him the whole time; passengers are never left alone in the van. He talked to that clock like it was a child. He went back at twenty-two thirty-eight, just after we came out of the tunnel.')) +
      C.stmt('D5', 'ferro', q('Emil came into my pantry at ten past ten for ice. We always drink one grappa for the Grauhorn, the two of us; it’s our custom, eleven minutes of dark and one glass. The photographer took our picture. Emil went back to his car at about a quarter to eleven.')) +
      C.stmt('D5', 'rinaldi', q('Miss Pryor sat at the bar from a quarter past ten until just after the tunnel. Two gin fizzes, and she wrote the whole time. Mademoiselle Imhof was at the writing desk from before ten until about five to eleven.') +
        q('The old lady at table 4 came in at about a quarter past ten and sat alone with her camomile. She dozed. The baron? He came later; I couldn’t tell you when, the salon filled up after the tunnel. He signed for a cognac, so the chit will say.')) + '</article>';
  };
})();

</script>
<script>
/* Nocturne in Ice: envelope D (Croatian). */
(function () {
  'use strict';
  var C = window.CASE, D = C.docs.hr;
  var q = function (t) { return '<p>„' + t + '“</p>'; };

  D.D1 = function () {
    var ids = ['margit', 'raoul', 'stoffel', 'baric', 'pryor', 'klara', 'baron'];
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Druga saslušanja, od 04:30 do 06:00</h3>' +
      '<p class="rep-intro">Ovaj sam put svakome najprije stavio dokaze pred nos. — A.&nbsp;T.</p>' + C.jump('D1', ids) +
      C.stmt('D1', 'margit', q('Dobro. Nisam bila u svom kupeu. U deset i pet otišla sam do Raoula, u vagon 1, broj 3, i ostala do malo prije jedanaest. Poruka je bila od njega. Počela sam je paliti, izgubila hrabrost i umjesto toga je poderala.') +
        q('Kad sam se vratila, prozor mi je bio širom otvoren, u kupeu je bilo ledeno, a čađa posvuda, na dasci, na jastuku. Mislila sam da je Stoffel prozračio i zaboravio zatvoriti. Zatvorila sam ga i legla. Nisam provirila do Casimira. Bože, oprosti mi, bilo mi je drago što su vrata zatvorena.') +
        q('Pištolj? Nisam ga taknula od Basela. Kutiju za toaletni pribor nikad ne zaključavam. Svatko tko je stajao u onom hodniku vidio je točno kamo je spremljen.')) +
      C.stmt('D1', 'raoul', q('Poruka je moja. Nas dvoje smo… od ljeta. Otac nije znao. Ili možda jest; znao je većinu stvari.') +
        q('Nakon svađe vratio sam se u kupe u pet do deset i nisam izašao sve dok kondukter nije prošao u ponoć. Margit je došla oko deset i pet, a otišla oko deset do jedanaest. Pitajte svog poslužitelja u vagonu 1; sjedi ondje cijelu noć sa svojom knjižicom.')) +
      C.stmt('D1', 'stoffel', q('Lagao sam vam, inspektore, i žao mi je. U deset i deset napustio sam mjesto i otišao u smočnicu vagona-restorana po led, a Giuseppe mi je natočio grappu za tunel, kao i uvijek. Fotograf nas je snimio. Na mjesto sam se vratio u petnaest do jedanaest.') +
        q('Nisam vidio hrvatskog gospodina kako kuca. Engleska mi je gospođica poslije ispričala. Rekao sam da sam vidio jer je monsieur Delorme već pisao tvrtki o meni, a ostao bih bez posla.')) +
      C.stmt('D1', 'baric', q('Pitajte konduktera iz prtljažnog vagona. Nije se maknuo od mene; putnicima ne vjeruju s prtljagom. Vratio sam se odmah nakon tunela i pokucao da Delormeu dam spise. Nitko nije odgovorio, pa sam mislio da me stari ignorira, kao i uvijek.') +
        q('A sad mi kažete da je već bio mrtav kad sam kucao. Deset godina želio sam mu smrt, inspektore. Čudno je otkriti da mi je žao.')) +
      C.stmt('D1', 'pryor', q('Dobro: pisala sam mu, triput. I pretražila sam mu kupe za večere, od oko osam i pet do pola devet, tražeći medicinsku dokumentaciju radionice. Našla sam pidžamu i aktovku koju nisam mogla otvoriti. Mora da mi je ispod ležaja ispala ukosnica.') +
        q('Ali u pola jedanaest sjedila sam na barskoj stolici s drugim gin fizzom, a kad je fotografu bljesnula bljeskalica, gotovo sam ga ispustila. Imate sliku.')) +
      C.stmt('D1', 'klara', q('Rekao mi je u studenome. Bio je moj otac i namjeravao je to reći, u Beču, pred bilježnikom, u ponedjeljak. Nakon dvadeset i osam godina.') +
        q('Mislite da bih ga ubila tri dana prije nego što mi je trebao dati svoje ime? Sad sam opet nitko. Stara oporuka ne zna da postojim.') +
        q('Cijelu sam večer bila za pisaćim stolom, leđima okrenuta prostoriji. Fotograf me prepao.')) +
      C.stmt('D1', 'baron', q('Rekao sam vam. Od deset i četvrt do petnaest do jedanaest sjedio sam s madame Duclos. Pitajte nju.') +
        q('Vaša fotografija pokazuje je samu u pola jedanaest? Onda sam bio u zahodu. Kakvo pitanje za postaviti čovjeku.') +
        q('Nisam izlazio iz vlaka u Sankt Oswinu. Kaput mi je mokar jer sam stao na stepenicu udahnuti zraka. Ne poznajem nikakvog šefa postaje.') +
        q('Sat? Oduvijek ga nosim na lijevoj ruci. Casimir je godinama dosađivao zbog te krunice.') +
        C.note('Zamolio sam ga da mi repetitor otkuca četvrti. Dugo je okretao krunicu amo-tamo prije nego što je pronašao klizač. Glavni kondukter, koji je iz Ticina i govori španjolski, pokušao je razgovarati s njim na tom jeziku; kaže da je barunov španjolski „španjolski iz udžbenika“.')) + '</article>';
  };

  D.D2 = function () {
    return '<article class="doc doc-report">' + C.head() + '<h3 class="rep-title">Izjava Mena Cadonaua, šefa postaje Sankt Oswin</h3>' + '<p class="rep-intro">Uzeta u 04:20, kad se vratio s lavine.</p>' +
      q('U pola dvanaest župnik Casutt sišao je od crkve kroz snijeg s pismom. ‚Za gospodina Delormea u Nokturnu‘, rekao je. ‚Dajte ga njemu i nikome drugome.‘ Stavio sam ga u ladicu.') +
      q('U dvanaest i četvrt, kad je vlak stajao već četvrt sata, u moj je ured iz vlaka ušao jedan gospodin. Visok, krzneni ovratnik, ožiljak na lijevom obrazu. Pitao je ima li pismo ili brzojav za gospodina Delormea. Pitao je na našem dolinskom njemačkom. To se ne čuje izvan Oswinske doline; mislio sam da je iz neke naše obitelji koja je otišla u grad.') +
      q('Rekao sam da je župnik Casutt ostavio pismo, ali da ga mogu dati samo gospodinu Delormeu i nikome drugome. Rekao je da gospodin Delorme spava i ne želi da ga se budi, pa će mu ga on odnijeti. Rekao sam ne. Dugo me gledao, a onda se vratio u vlak.') +
      q('U dvanaest i dvadeset zaključao sam ured i izašao na prugu s ekipom za lavinu. Kad sam čuo da je gospodin Delorme mrtav, sačuvao sam pismo za vas. Evo ga. Nisam ga otvorio.') + '</article>';
  };

  D.D3 = function () {
    return '<article class="doc doc-hand"><p class="hd-head">Pfarramt Sankt Oswin · 18. prosinca 1936., 23:20</p>' +
      C.hand('<p>Poštovani gospodine Delorme,</p><p>Vaš brzojav stigao mi je večeras u petnaest do deset. Pitate je li Kaspar Gredig, vodič kojeg sam ovdje pokopao 25. kolovoza 1934., bio ljevak ili dešnjak.</p>' +
        '<p>Bio je dešnjak. Trideset sam ga godina gledao kako rezbari, puca i reže kruh, uvijek desnom rukom.</p>' +
        '<p>Ali moram Vam reći ono što nikome nisam rekao. Kad sam prao tijelo prije pokopa, srednji prst lijeve ruke imao je onaj tvrdi žulj koji ostaje od dugogodišnjeg držanja pera. Kaspar se jedva znao potpisati. Govorio sam sebi da mi tuga pravi šale, lica više nije bilo, barun je ležao u bolnici u Innsbrucku, i tko sam ja da išta kažem.</p>' +
        '<p>Ako nešto znate, za ime Božje, recite mi. Ovo ću sam odnijeti na postaju.</p><p>Luzi Casutt, župnik</p>') +
      '<p class="caption">Šef postaje predao ga je policiji u 04:20, neotvoreno.</p></article>';
  };

  D.D4 = function () {
    return '<article class="doc doc-report">' + '<header class="rep-head"><span>Oswinska željeznica · održavanje pruge</span><span>Ophodnja</span></header>' +
      '<h3 class="rep-title">Izvještaj ophodnje pruge, tunel Grauhorn</h3>' +
      C.kv([['Ophodnja', 'Gion Derungs, predradnik, s dvojicom ljudi'], ['Vrijeme', '19. prosinca 1936., od 02:10 do 03:05, pješice od sjevernog do južnog portala'],
        ['Razlog', 'Nakon uzbune zbog lavine pješice se obilazi svaki tunel na pruzi da se potraži odlomljeni led']]) +
      '<p>Na <b>3,9 km</b> od sjevernog portala, u tucaniku uz kolosijek kojim prolazi Nokturno, pronašli smo mali automatski pištolj: FN, kalibar 6,35 mm, model „Baby“, serijski broj <span class="mono">81 604</span>. Crn od čađe. Jedan metak ispaljen, pet ih je ostalo u spremniku.</p>' +
      '<p>Ležao je metar od tračnice, ondje gdje bi pala stvar bačena kroz prozor vagona.</p>' +
      '<p>Otkako je Nokturno prošao između 22:24 i 22:35, kroz tunel nije prošao nijedan drugi vlak. Pruga je iza njega zatvorena u Sargansu u 22:40 zbog snijega.</p>' +
      '<p class="sign">G. Derungs</p></article>';
  };

  D.D5 = function () {
    return '<article class="doc doc-interviews">' + C.head() + '<h3 class="rep-title">Izjave osoblja vlaka</h3>' +
      C.stmt('D5', 'tschudi', q('Gospodin Barić došao je u prtljažni vagon u deset i četvrt pogledati svoj sanduk, broj 14. Velik sat, sav od stakla i mjedi. Bio sam s njim cijelo vrijeme; putnici se nikad ne ostavljaju sami u prtljažnom vagonu. Razgovarao je s tim satom kao s djetetom. Vratio se u dvadeset dva i trideset osam, odmah nakon što smo izašli iz tunela.')) +
      C.stmt('D5', 'ferro', q('Emil je došao u moju smočnicu u deset i deset po led. Nas dvojica uvijek popijemo jednu grappu za Grauhorn; to nam je običaj, jedanaest minuta mraka i jedna čašica. Fotograf nas je snimio. Emil se vratio u svoj vagon oko petnaest do jedanaest.')) +
      C.stmt('D5', 'rinaldi', q('Gospođica Pryor sjedila je za šankom od deset i četvrt do malo nakon tunela. Dva gin fizza, i cijelo je vrijeme pisala. Mademoiselle Imhof bila je za pisaćim stolom od prije deset do otprilike pet do jedanaest.') +
        q('Stara gospođa za stolom 4 došla je oko deset i četvrt i sjedila sama sa svojom kamilicom. Drijemala je. Barun? Došao je kasnije; ne bih vam znao reći kad, nakon tunela salon se napunio. Potpisao je račun za konjak, pa će na računu pisati.')) + '</article>';
  };
})();
